<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손익 대시보드</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --up: #15803d;
    --down: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 40px;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 22px; }
  .years { display: flex; flex-wrap: wrap; gap: 6px; }
  .years button {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 999px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .years button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .kpi {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  .kpi.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .kpi .label { font-size: 13px; color: var(--muted); }
  .kpi .value { font-size: 24px; font-weight: 700; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
  .kpi .delta { font-size: 13px; color: var(--muted); }
  .kpi .delta.up { color: var(--up); }
  .kpi .delta.down { color: var(--down); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .panel h2 { margin: 0 0 4px; font-size: 16px; }
  .panel .sub { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; margin-bottom: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  svg { width: 100%; height: auto; display: block; }
  svg text { font-size: 12px; fill: var(--muted); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  @media (max-width: 760px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .kpi .value { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>손익 대시보드</h1>
    <div class="years" id="years"></div>
  </header>
  <section class="kpis" id="kpis"></section>
  <section class="panel">
    <h2 id="chart-title">월별 추이</h2>
    <p class="sub">단위: 억 원 · KPI 카드를 누르면 차트 항목이 바뀝니다</p>
    <div class="legend" id="legend"></div>
    <div id="chart"></div>
  </section>
</div>

<script>
const DATA = [{"year": 2020, "sources": ["분개장_2020년.xlsx"], "rows": 54673, "annual": {"revenue": 26701047823, "cogs": 22932434729, "sga": 2166550225, "operating_income": 1602062869}, "monthly": [{"month": 1, "revenue": 1875085142, "cogs": 1463797082, "sga": 153968681, "operating_income": 257319379}, {"month": 2, "revenue": 2006877556, "cogs": 1662202623, "sga": 156324983, "operating_income": 188349950}, {"month": 3, "revenue": 2928968264, "cogs": 1924448825, "sga": 188836526, "operating_income": 815682913}, {"month": 4, "revenue": 2447960896, "cogs": 1856309461, "sga": 179339464, "operating_income": 412311971}, {"month": 5, "revenue": 2303222612, "cogs": 1835227586, "sga": 180466685, "operating_income": 287528341}, {"month": 6, "revenue": 2175924960, "cogs": 1963858931, "sga": 177693812, "operating_income": 34372217}, {"month": 7, "revenue": 2273107854, "cogs": 1966124365, "sga": 183892887, "operating_income": 123090602}, {"month": 8, "revenue": 1922013141, "cogs": 1825152235, "sga": 162428479, "operating_income": -65567573}, {"month": 9, "revenue": 2095163677, "cogs": 1874514562, "sga": 166317450, "operating_income": 54331665}, {"month": 10, "revenue": 1933525306, "cogs": 1734210581, "sga": 179058977, "operating_income": 20255748}, {"month": 11, "revenue": 2313319454, "cogs": 1978549471, "sga": 207586303, "operating_income": 127183680}, {"month": 12, "revenue": 2425878961, "cogs": 2848039007, "sga": 230635978, "operating_income": -652796024}]}, {"year": 2021, "sources": ["분개장_2021년.xlsx"], "rows": 73210, "annual": {"revenue": 39269602093, "cogs": 34213678131, "sga": 2699747836, "operating_income": 2356176126}, "monthly": [{"month": 1, "revenue": 2632386160, "cogs": 2901730666, "sga": 186775828, "operating_income": -456120334}, {"month": 2, "revenue": 2467992386, "cogs": 2903058924, "sga": 179973158, "operating_income": -615039696}, {"month": 3, "revenue": 2874644634, "cogs": 2890171438, "sga": 217708682, "operating_income": -233235486}, {"month": 4, "revenue": 3047042773, "cogs": 2757299307, "sga": 213496902, "operating_income": 76246564}, {"month": 5, "revenue": 2723957263, "cogs": 3001515576, "sga": 225092330, "operating_income": -502650643}, {"month": 6, "revenue": 2681835797, "cogs": 2681901434, "sga": 191679821, "operating_income": -191745458}, {"month": 7, "revenue": 3581182548, "cogs": 3038153080, "sga": 249313912, "operating_income": 293715556}, {"month": 8, "revenue": 3515298217, "cogs": 2892080123, "sga": 231479648, "operating_income": 391738446}, {"month": 9, "revenue": 3018419270, "cogs": 2619590784, "sga": 217426168, "operating_income": 181402318}, {"month": 10, "revenue": 3945424716, "cogs": 2586071032, "sga": 261975747, "operating_income": 1097377937}, {"month": 11, "revenue": 4093160666, "cogs": 2944855587, "sga": 232167078, "operating_income": 916138001}, {"month": 12, "revenue": 4688257663, "cogs": 2997250180, "sga": 292658562, "operating_income": 1398348921}]}];

const METRICS = [
  { key: "revenue", label: "매출" },
  { key: "cogs", label: "매출원가" },
  { key: "sga", label: "판관비" },
  { key: "operating_income", label: "영업이익" },
];
const COLORS = ["#2563eb", "#f97316", "#16a34a", "#9333ea", "#db2777", "#0891b2", "#ca8a04", "#4b5563"];
const SVG_NS = "http://www.w3.org/2000/svg";

const byYear = Object.fromEntries(DATA.map(d => [d.year, d]));
const years = DATA.map(d => d.year).sort((a, b) => a - b);
const state = { year: years[years.length - 1], metric: "revenue" };

const toEok = v => v / 1e8;
const fmtEok = v => toEok(v).toLocaleString("ko-KR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "억";
const colorOf = year => COLORS[years.indexOf(year) % COLORS.length];

function renderYears() {
  const box = document.getElementById("years");
  box.innerHTML = "";
  years.forEach(y => {
    const btn = document.createElement("button");
    btn.textContent = y + "년";
    btn.className = y === state.year ? "active" : "";
    btn.onclick = () => { state.year = y; render(); };
    box.appendChild(btn);
  });
}

function renderKpis() {
  const box = document.getElementById("kpis");
  box.innerHTML = "";
  const cur = byYear[state.year].annual;
  const prev = byYear[state.year - 1] ? byYear[state.year - 1].annual : null;
  METRICS.forEach(m => {
    const card = document.createElement("button");
    card.className = "kpi" + (m.key === state.metric ? " active" : "");
    card.onclick = () => { state.metric = m.key; render(); };

    let deltaText = "전기 데이터 없음";
    let deltaClass = "";
    if (prev && prev[m.key] !== 0) {
      const rate = (cur[m.key] - prev[m.key]) / Math.abs(prev[m.key]) * 100;
      const sign = rate > 0 ? "▲" : rate < 0 ? "▼" : "";
      deltaText = `전기 대비 ${sign} ${Math.abs(rate).toFixed(1)}%`;
      // 비용 항목은 증가가 불리하므로 색을 반대로 표시
      const good = m.key === "cogs" || m.key === "sga" ? rate < 0 : rate > 0;
      deltaClass = rate === 0 ? "" : good ? "up" : "down";
    }
    card.innerHTML = `
      <div class="label">${m.label}</div>
      <div class="value" title="${cur[m.key].toLocaleString("ko-KR")}원">${fmtEok(cur[m.key])}</div>
      <div class="delta ${deltaClass}">${deltaText}</div>`;
    box.appendChild(card);
  });
}

function el(name, attrs, text) {
  const node = document.createElementNS(SVG_NS, name);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  if (text !== undefined) node.textContent = text;
  return node;
}

function niceStep(range, count) {
  const raw = range / count;
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / pow;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * pow;
}

function renderChart() {
  const metric = METRICS.find(m => m.key === state.metric);
  document.getElementById("chart-title").textContent = `월별 ${metric.label} 추이 (연도 비교)`;

  const legend = document.getElementById("legend");
  legend.innerHTML = years.map(y =>
    `<span><i style="background:${colorOf(y)}"></i>${y}년</span>`).join("");

  const W = 1000, H = 380, pad = { top: 16, right: 20, bottom: 36, left: 64 };
  const iw = W - pad.left - pad.right, ih = H - pad.top - pad.bottom;

  const series = years.map(y => ({
    year: y,
    values: byYear[y].monthly.map(r => toEok(r[state.metric])),
  }));
  const all = series.flatMap(s => s.values);
  let min = Math.min(0, ...all), max = Math.max(0, ...all);
  if (min === max) max = min + 1;
  const step = niceStep(max - min, 5);
  min = Math.floor(min / step) * step;
  max = Math.ceil(max / step) * step;

  const x = m => pad.left + (m - 1) / 11 * iw;
  const y = v => pad.top + (max - v) / (max - min) * ih;

  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `월별 ${metric.label} 추이` });

  for (let v = min; v <= max + step / 2; v += step) {
    svg.appendChild(el("line", { x1: pad.left, x2: W - pad.right, y1: y(v), y2: y(v),
      stroke: Math.abs(v) < step / 2 ? "#9ca3af" : "#e5e7eb" }));
    svg.appendChild(el("text", { x: pad.left - 8, y: y(v) + 4, "text-anchor": "end" },
      v.toLocaleString("ko-KR", { maximumFractionDigits: 1 })));
  }
  for (let m = 1; m <= 12; m++) {
    svg.appendChild(el("text", { x: x(m), y: H - pad.bottom + 22, "text-anchor": "middle" }, m + "월"));
  }

  // 선택 연도를 마지막에 그려 위에 오도록 한다
  const ordered = series.filter(s => s.year !== state.year).concat(series.filter(s => s.year === state.year));
  ordered.forEach(s => {
    const selected = s.year === state.year;
    const color = colorOf(s.year);
    const points = s.values.map((v, i) => `${x(i + 1)},${y(v)}`).join(" ");
    svg.appendChild(el("polyline", { points, fill: "none", stroke: color,
      "stroke-width": selected ? 3 : 2, opacity: selected ? 1 : 0.55, "stroke-linejoin": "round" }));
    s.values.forEach((v, i) => {
      const dot = el("circle", { cx: x(i + 1), cy: y(v), r: selected ? 4 : 3, fill: color, opacity: selected ? 1 : 0.55 });
      dot.appendChild(el("title", {}, `${s.year}년 ${i + 1}월 ${metric.label}: ${v.toLocaleString("ko-KR", { maximumFractionDigits: 1 })}억`));
      svg.appendChild(dot);
    });
  });

  const box = document.getElementById("chart");
  box.innerHTML = "";
  box.appendChild(svg);
}

function render() {
  renderYears();
  renderKpis();
  renderChart();
}

if (years.length) {
  render();
} else {
  document.querySelector(".wrap").innerHTML = '<div class="empty">표시할 데이터가 없습니다.</div>';
}
</script>
</body>
</html>
